version: "3.9"

services:
  postgres:
    image: postgres:16
    restart: "no"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: tomato_form
      POSTGRES_USER: tomato
      POSTGRES_PASSWORD: tomato

  rabbitmq:
    image: rabbitmq:3-management
    restart: "no"
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: tomato
      RABBITMQ_DEFAULT_PASS: tomato
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  meilisearch:
    image: getmeili/meilisearch:v1.10
    restart: "no"
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: tomato
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch_data:/meili_data

  # ollama:
  #   image: ollama/ollama:latest
  #   restart: "no"
  #   mem_limit: 8g
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama

volumes:
  postgres_data:
  rabbitmq_data:
  meilisearch_data:
  ollama_data:
